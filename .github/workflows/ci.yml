name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - run: docker compose up -d
      - run: npm exec playwright install chromium --with-deps
      - name: Wait for Grafana
        run: curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
      - run: npm run e2e -- --reporter=line
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
